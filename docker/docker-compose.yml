version: '3.9'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    command: npm run dev
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: sqlite:/app/dev.db
      NEXTAUTH_SECRET: dev-secret-replace-in-production
      NEXTAUTH_URL: http://localhost:3000
      SEED_ADMIN_NAME: Admin
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: changeme
    volumes:
      - ..:/app
      - /app/node_modules    # keep container node_modules separate from host
      - db-data:/app/data    # SQLite database directory
    restart: unless-stopped

volumes:
  db-data:
